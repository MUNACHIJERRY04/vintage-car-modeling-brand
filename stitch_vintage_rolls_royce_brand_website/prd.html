<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PRD Reader | The Sovereign Archive (Rolls-Royce Vintage)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      background-color: #0B1426;
      color: #F3EBDD;
      font-family: 'Inter', sans-serif;
    }
    h1, h2, h3, h4 {
      font-family: 'Playfair Display', serif;
      color: #F3EBDD;
    }
    h1 { font-size: 2.25rem; margin-top: 2rem; margin-bottom: 1rem; border-bottom: 1px solid rgba(201, 169, 106, 0.3); padding-bottom: 0.5rem; }
    h2 { font-size: 1.75rem; margin-top: 2.5rem; margin-bottom: 1rem; color: #C9A96A; }
    h3 { font-size: 1.35rem; margin-top: 1.75rem; margin-bottom: 0.75rem; color: #6CC3E8; }
    p, li { line-height: 1.7; color: #A9B2C3; }
    strong { color: #F3EBDD; }
    code { background: #1B2A4E; color: #6CC3E8; padding: 2px 6px; border-radius: 4px; font-size: 0.88em; }
    pre { background: #101C38 !important; border: 1px solid rgba(201, 169, 106, 0.25); border-radius: 6px; padding: 1.25rem; overflow-x: auto; margin: 1.5rem 0; }
    pre code { background: transparent; padding: 0; color: #dae2ff; }
    table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-size: 0.9rem; }
    th { background: #1B2A4E; color: #C9A96A; font-family: 'Playfair Display', serif; text-align: left; padding: 10px 14px; border: 1px solid rgba(201, 169, 106, 0.25); }
    td { padding: 10px 14px; border: 1px solid rgba(201, 169, 106, 0.15); background: #101C38; color: #A9B2C3; }
    tr:nth-child(even) td { background: #0E1A36; }
    blockquote { border-left: 3px solid #C9A96A; padding-left: 1rem; margin: 1.5rem 0; color: #C9A96A; font-style: italic; background: rgba(201, 169, 106, 0.05); padding-top: 0.5rem; padding-bottom: 0.5rem; }
    hr { border-color: rgba(201, 169, 106, 0.25); margin: 2.5rem 0; }
    a { color: #6CC3E8; text-decoration: underline; }
    a:hover { color: #C9A96A; }
  </style>
</head>
<body class="min-h-screen">
  <!-- Top Bar -->
  <header class="sticky top-0 z-50 bg-[#0B1426]/90 backdrop-blur-md border-b border-[#C9A96A]/30 px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-[#C9A96A] font-serif text-lg font-semibold tracking-wider">THE SOVEREIGN ARCHIVE</span>
      <span class="text-[#A9B2C3]/40">|</span>
      <span class="text-xs uppercase tracking-widest text-[#6CC3E8] bg-[#1E6FA8]/20 px-2.5 py-1 rounded border border-[#6CC3E8]/30">PRD Specification Viewer</span>
    </div>
    <div class="flex items-center gap-4">
      <a href="/" class="inline-flex items-center gap-1.5 bg-[#C9A96A] hover:bg-[#DFC28A] text-[#0B1426] font-semibold text-xs uppercase tracking-widest px-4 py-2 rounded transition-all">
        <span class="material-symbols-outlined text-sm">visibility</span>
        View Live Website UI
      </a>
      <a href="/PRD_ROLLS_ROYCE_VINTAGE.md" target="_blank" class="inline-flex items-center gap-1.5 bg-[#101C38] hover:bg-[#1B2A4E] border border-[#C9A96A]/40 text-[#A9B2C3] hover:text-[#F3EBDD] text-xs uppercase tracking-widest px-3 py-2 rounded transition-all">
        <span class="material-symbols-outlined text-sm">description</span>
        Raw Markdown
      </a>
    </div>
  </header>

  <!-- Container -->
  <main class="max-w-5xl mx-auto px-6 py-10">
    <div id="content" class="prose max-w-none">
      <div class="text-center py-20 text-[#A9B2C3]">Loading PRD Document...</div>
    </div>
  </main>

  <script>
    fetch('/PRD_ROLLS_ROYCE_VINTAGE.md')
      .then(res => res.text())
      .then(md => {
        document.getElementById('content').innerHTML = marked.parse(md);
      })
      .catch(err => {
        document.getElementById('content').innerHTML = `<p class="text-red-400">Failed to load PRD: ${err.message}</p>`;
      });
  </script>
</body>
</html>
